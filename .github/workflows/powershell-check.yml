name: PowerShell script checks

on:
  push:
    paths:
      - "scripts/**/*.ps1"
      - ".github/workflows/powershell-check.yml"
  pull_request:
    paths:
      - "scripts/**/*.ps1"
      - ".github/workflows/powershell-check.yml"

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $scriptRoot = Join-Path $env:GITHUB_WORKSPACE "scripts"
          if (-not (Test-Path -LiteralPath $scriptRoot -PathType Container)) {
            Write-Host "No scripts directory found; skipping PowerShell syntax check."
            exit 0
          }

          $files = Get-ChildItem -LiteralPath $scriptRoot -Filter *.ps1 -File
          if ($files.Count -eq 0) {
            Write-Host "No .ps1 files found; skipping PowerShell syntax check."
            exit 0
          }

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
            Write-Host "OK: $($file.Name)"
          }
