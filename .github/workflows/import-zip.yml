name: Import ZIP from repository root

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/import-zip.yml"
      - "scripts/extract-update.py"

permissions:
  contents: write

concurrency:
  group: import-root-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    if: "!contains(github.event.head_commit.message, '[skip zip import]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract ZIP files uploaded to repository root
        run: |
          shopt -s nullglob
          archives=(./*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No ZIP files found in repository root."
            exit 0
          fi
          for archive in "${archives[@]}"; do
            echo "Importing: $archive"
            python scripts/extract-update.py "$archive"
            rm -- "$archive"
          done

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $scriptRoot = Join-Path $env:GITHUB_WORKSPACE "scripts"
          if (-not (Test-Path -LiteralPath $scriptRoot -PathType Container)) {
            Write-Error "The ZIP did not produce the required scripts directory."
            exit 1
          }

          $files = Get-ChildItem -LiteralPath $scriptRoot -Filter *.ps1 -File
          if ($files.Count -eq 0) {
            Write-Error "No PowerShell (.ps1) files were found in scripts/."
            exit 1
          }

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
            Write-Host "OK: $($file.Name)"
          }

      - name: Commit extracted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Apply uploaded ZIP revision [skip zip import]"
            git push
          fi
