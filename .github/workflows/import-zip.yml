name: Import ZIP from repository root

on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/import-zip.yml"

permissions:
  contents: write

concurrency:
  group: import-root-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    if: "!contains(github.event.head_commit.message, '[skip zip import]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files uploaded to repository root
        shell: bash
        run: |
          shopt -s nullglob
          archives=(./*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No ZIP files found in repository root."
            exit 0
          fi

          for archive in "${archives[@]}"; do
            echo "Importing: $archive"
            python3 - "$archive" <<'PY'
          import os
          import pathlib
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path.cwd().resolve()
          max_files = 10000
          max_uncompressed = 500 * 1024 * 1024
          total_size = 0

          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()
              if len(entries) > max_files:
                  raise SystemExit("ZIP contains too many files")

              for info in entries:
                  name = info.filename.replace("\\", "/")
                  parts = pathlib.PurePosixPath(name).parts
                  if not name or name.startswith("/") or ".." in parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  if ".git" in parts or "__MACOSX" in parts:
                      raise SystemExit(f"Blocked ZIP entry: {name}")
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlinks are not allowed: {name}")
                  total_size += info.file_size
                  if total_size > max_uncompressed:
                      raise SystemExit("ZIP exceeds 500 MiB uncompressed limit")

              for info in entries:
                  name = info.filename.replace("\\", "/")
                  target = (root / pathlib.PurePosixPath(name)).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe extraction target: {name}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as src, open(target, "wb") as dst:
                          while True:
                              chunk = src.read(1024 * 1024)
                              if not chunk:
                                  break
                              dst.write(chunk)

          print(f"Extracted {archive.name} successfully")
          PY
            rm -- "$archive"
          done

      - name: Check PowerShell syntax when scripts exist
        shell: pwsh
        run: |
          $scriptRoot = Join-Path $env:GITHUB_WORKSPACE "scripts"
          if (-not (Test-Path -LiteralPath $scriptRoot -PathType Container)) {
            Write-Host "No scripts directory found; skipping syntax check."
            exit 0
          }

          $files = Get-ChildItem -LiteralPath $scriptRoot -Filter *.ps1 -File
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
            Write-Host "OK: $($file.Name)"
          }

      - name: Commit extracted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Apply uploaded ZIP revision [skip zip import]"
            git push
          fi
